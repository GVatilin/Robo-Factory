name: robo-factory

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-robo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-robofactory}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  backend:
    image: robo-factory-backend:${IMAGE_TAG:-local}
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-robo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-robofactory}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      ENVIRONMENT: production
      CORS_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN}
      SEED_ON_STARTUP: "false"
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
      - ${DATASETS_DIR:-/opt/robo-factory/shared/datasets}:/datasets:ro
    logging: *logging

  frontend:
    image: robo-factory-frontend:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      args:
        VITE_SHOW_DEMO_ACCOUNTS: "false"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  pgdata:
    name: robo-factory_pgdata
  uploads:
    name: robo-factory_uploads
  caddy_data:
    name: robo-factory_caddy_data
  caddy_config:
    name: robo-factory_caddy_config
